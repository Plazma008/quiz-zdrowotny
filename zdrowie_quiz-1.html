<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy }
  from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBrY5eRtLvNH43tmcb_3s3APul-uQzH8ok",
  authDomain: "edu-zdrowotna.firebaseapp.com",
  projectId: "edu-zdrowotna",
  storageBucket: "edu-zdrowotna.firebasestorage.app",
  messagingSenderId: "434567782145",
  appId: "1:434567782145:web:0311d68279361687324500"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const ADMIN_PASSWORD = "edukacjazdrowotna";

window.saveToFirebase = async (score, total, nick) => {
  await addDoc(collection(db, "wyniki"), {
    wynik: score,
    total: total,
    pct: Math.round((score / total) * 100),
    nick: nick || "Anonim",
    data: new Date().toLocaleString("pl-PL"),
    ts: Date.now()
  });
};

window.showAdmin = async () => {
  if (document.getElementById("adminPass").value !== ADMIN_PASSWORD) {
    alert("Błędne hasło admina!"); return;
  }
  document.getElementById("admin").classList.remove("hidden");
  document.getElementById("adminData").innerHTML = "⏳ Ładowanie...";
  try {
    const q = query(collection(db, "wyniki"), orderBy("ts", "desc"));
    const snap = await getDocs(q);
    const results = [];
    snap.forEach(d => results.push(d.data()));
    if (!results.length) {
      document.getElementById("adminData").innerHTML = "<i>Brak wyników</i>"; return;
    }
    const avgPct = Math.round(results.reduce((a,b) => a + b.pct, 0) / results.length);
    const avgPts = (results.reduce((a,b) => a + b.wynik, 0) / results.length).toFixed(1);
    const bestPct = Math.max(...results.map(r => r.pct));
    let html = `<span class="stat">👥 ${results.length} graczy</span><hr class="divider">
<span class="stat">⭐ Średnia: ${avgPts} pkt / ${avgPct}%</span><br>
<span class="stat">🏆 Najlepszy: ${bestPct}%</span><hr class="divider">`;
    results.forEach((r, i) => {
      html += `<b>#${i+1} ${r.nick}</b> – ${r.wynik}/${r.total} <span style="color:#00796b;font-weight:bold">(${r.pct}%)</span> <small style="color:#bbb">${r.data}</small><br>`;
    });
    document.getElementById("adminData").innerHTML = html;
  } catch(e) {
    document.getElementById("adminData").innerHTML = "❌ Błąd połączenia z bazą.";
  }
};

window.clearResults = async () => {
  if (!confirm("Na pewno wyczyścić WSZYSTKIE wyniki?")) return;
  const snap = await getDocs(collection(db, "wyniki"));
  await Promise.all(snap.docs.map(d => deleteDoc(doc(db, "wyniki", d.id))));
  document.getElementById("adminData").innerHTML = "<i>Wyniki wyczyszczone ✅</i>";
};

window.toggleQR = () => {
  const sec = document.getElementById("qrSection");
  sec.classList.toggle("hidden");
  if (!sec.classList.contains("hidden") && !document.getElementById("qrcode").innerHTML) {
    const url = window.location.href;
    document.getElementById("qrLink").innerText = url;
    document.getElementById("qrcode").innerHTML =
      `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}" width="200" height="200" alt="QR">`;
  }
};
</script>

  "idiota","idioci","głupek","głupku","debil","debila","debilowi","kretyno","kretyn",
  "pedał","pedała","pedałowi","pedale","homoseksuali","pedofil","nazista","nazistów"
];

function containsBannedWord(text) {
  const lower = text.toLowerCase().replace(/[^a-ząćęłńóśźż]/g, " ");
  return BANNED.some(word => {
    const re = new RegExp(`(^|\\s)${word}(\\s|$)`);
    return re.test(lower) || lower.includes(word);
  });
}

window.startGame = () => {
  const raw = document.getElementById("nickname").value.trim();
  const errEl = document.getElementById("nickError");

  if (raw && containsBannedWord(raw)) {
    errEl.classList.remove("hidden");
    document.getElementById("nickname").style.borderColor = "#e53935";
    return;
  }

  errEl.classList.add("hidden");
  document.getElementById("nickname").style.borderColor = "";
  playerNick = raw || "Anonim";
  document.getElementById("login").style.display = "none";
  document.getElementById("game").classList.remove("hidden");
  questions = shuffle([...allQuestions]).slice(0, TOTAL_QUESTIONS);
  current = 0; score = 0;
  showQuestion();
};

function showQuestion() {
  const q = questions[current];
  document.getElementById("progressText").innerText = `Pytanie ${current + 1} z ${TOTAL_QUESTIONS}`;
  document.getElementById("progressBar").style.width = ((current / TOTAL_QUESTIONS) * 100) + "%";
  document.getElementById("question").innerText = q.q;
  document.getElementById("result").innerText = "";
  currentAnswers = shuffle([q.correct, ...q.wrong]);
  const labels = ["A", "B", "C"];
  document.getElementById("answers").innerHTML = currentAnswers.map((ans, i) =>
    `<button class="btn-answer" onclick="checkAnswer(${i})"><b>${labels[i]}.</b> ${ans}</button>`
  ).join("");
}

window.checkAnswer = (i) => {
  document.querySelectorAll(".btn-answer").forEach(b => b.disabled = true);
  const correctIndex = currentAnswers.indexOf(questions[current].correct);
  const btns = document.querySelectorAll(".btn-answer");
  if (i === correctIndex) {
    score++;
    btns[i].style.background = "#a5d6a7";
    document.getElementById("result").innerText = "✅ Dobrze!";
  } else {
    btns[i].style.background = "#ef9a9a";
    btns[correctIndex].style.background = "#a5d6a7";
    document.getElementById("result").innerText = "❌ Błąd!";
  }
  setTimeout(() => { current++; current < questions.length ? showQuestion() : endGame(); }, 900);
};

async function endGame() {
  const pct = Math.round((score / TOTAL_QUESTIONS) * 100);
  document.getElementById("progressText").innerText = "Koniec gry!";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("question").innerHTML =
    `🎉 Świetnie, ${playerNick}!
     <div class="score-big">${score}/${TOTAL_QUESTIONS}</div>
     <div class="score-pct">${pct}% poprawnych odpowiedzi</div>`;
  document.getElementById("answers").innerHTML = `<p style="color:#aaa;font-size:0.85rem">💾 Zapisuję wynik...</p>`;
  document.getElementById("result").innerText = "";
  await window.saveToFirebase(score, TOTAL_QUESTIONS, playerNick);
  document.getElementById("answers").innerHTML =
    `<p style="color:#00796b;margin-bottom:10px;">✅ Wynik zapisany!</p>
     <button class="btn btn-green" onclick="location.reload()">🔄 Zagraj ponownie</button>`;
}
</script>
