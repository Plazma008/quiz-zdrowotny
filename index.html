<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oddychaj, Ruszaj, Myśl</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e0f7fa, #b2ebf2);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 28px 20px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    text-align: center;
  }
  h1 { font-size: 1.5rem; color: #00796b; margin-bottom: 4px; }
  h3 { font-size: 0.95rem; color: #555; margin-bottom: 24px; font-weight: normal; }
  label {
    display: block;
    text-align: left;
    font-size: 0.85rem;
    color: #444;
    margin-bottom: 4px;
    margin-top: 14px;
  }
  input[type="password"], input[type="text"] {
    width: 100%;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 1rem;
    outline: none;
    transition: border 0.2s;
  }
  input:focus { border-color: #00796b; }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:active { opacity: 0.8; }
  .btn-green  { background: #00796b; color: white; }
  .btn-yellow { background: #f9a825; color: white; }
  .btn-gray   { background: #eee; color: #333; }
  .btn-answer {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    font-size: 0.95rem;
    background: #e0f2f1;
    color: #004d40;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
    text-align: left;
  }
  .btn-answer:active { background: #b2dfdb; }
  #question {
    font-size: 1.1rem;
    font-weight: bold;
    color: #222;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .progress { font-size: 0.8rem; color: #aaa; margin-bottom: 10px; }
  .progress-bar-bg {
    background: #e0e0e0;
    border-radius: 10px;
    height: 8px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 8px;
    background: #00796b;
    border-radius: 10px;
    transition: width 0.4s;
  }
  #result { font-size: 1rem; color: #00796b; margin-top: 16px; font-weight: bold; }
  .admin-box {
    background: #fff8e1;
    border-radius: 12px;
    padding: 16px;
    margin-top: 16px;
    text-align: left;
    font-size: 0.9rem;
    color: #555;
    line-height: 1.8;
    max-height: 320px;
    overflow-y: auto;
  }
  .hidden { display: none; }
  .score-big { font-size: 2.6rem; font-weight: bold; color: #00796b; margin: 10px 0 4px; }
  .score-pct { font-size: 1.2rem; color: #888; margin-bottom: 6px; }
  .qr-box {
    background: #f1f8e9;
    border-radius: 12px;
    padding: 16px;
    margin-top: 12px;
    text-align: center;
  }
  .qr-box img { margin: 10px auto; display: block; border-radius: 8px; }
  .qr-box p { font-size: 0.75rem; color: #777; word-break: break-all; margin-top: 8px; }
  .stat { font-size: 1.05rem; font-weight: bold; color: #00796b; }
  .divider { border: none; border-top: 1px solid #eee; margin: 12px 0; }
</style>
</head>
<body>
<div class="card">
  <h1>🌿 Oddychaj, Ruszaj, Myśl</h1>
  <h3>Twoje Zdrowie to Kod Dnia!</h3>

  <div id="login">
    <label>Twoje imię (opcjonalnie):</label>
    <input id="nickname" type="text">
    <button class="btn btn-green" onclick="startGame()">▶ Rozpocznij grę</button>
    <hr class="divider" style="margin-top:24px;">
    <label>Hasło admina:</label>
    <input id="adminPass" type="password">
    <button class="btn btn-yellow" onclick="showAdmin()">🔒 Panel nauczyciela</button>
  </div>

  <div id="game" class="hidden">
    <div id="question"></div>
    <div id="answers"></div>
    <p id="result"></p>
  </div>

  <div id="admin" class="hidden">
    <div id="adminData">Ładowanie...</div>
  </div>
</div>

<script>
const ADMIN_PASSWORD = "admin123"; // ✅ ZMIENIONE HASŁO

window.showAdmin = () => {
  if (document.getElementById("adminPass").value !== ADMIN_PASSWORD) {
    alert("Błędne hasło admina!");
    return;
  }
  document.getElementById("admin").classList.remove("hidden");
};
</script>
</body>
</html>
