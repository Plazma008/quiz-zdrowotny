<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oddychaj, Ruszaj, Myśl</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e0f7fa, #b2ebf2);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 28px 20px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    text-align: center;
  }
  h1 { font-size: 1.5rem; color: #00796b; margin-bottom: 4px; }
  h3 { font-size: 0.95rem; color: #555; margin-bottom: 24px; font-weight: normal; }
  label {
    display: block;
    text-align: left;
    font-size: 0.85rem;
    color: #444;
    margin-bottom: 4px;
    margin-top: 14px;
  }
  input[type="password"], input[type="text"] {
    width: 100%;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 1rem;
    outline: none;
    transition: border 0.2s;
  }
  input:focus { border-color: #00796b; }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:active { opacity: 0.8; }
  .btn-green  { background: #00796b; color: white; }
  .btn-yellow { background: #f9a825; color: white; }
  .btn-gray   { background: #eee; color: #333; }
  .btn-answer {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    font-size: 0.95rem;
    background: #e0f2f1;
    color: #004d40;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
    text-align: left;
  }
  .btn-answer:active { background: #b2dfdb; }
  #question {
    font-size: 1.1rem;
    font-weight: bold;
    color: #222;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .progress { font-size: 0.8rem; color: #aaa; margin-bottom: 10px; }
  .progress-bar-bg {
    background: #e0e0e0;
    border-radius: 10px;
    height: 8px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 8px;
    background: #00796b;
    border-radius: 10px;
    transition: width 0.4s;
  }
  #result { font-size: 1rem; color: #00796b; margin-top: 16px; font-weight: bold; }
  .admin-box {
    background: #fff8e1;
    border-radius: 12px;
    padding: 16px;
    margin-top: 16px;
    text-align: left;
    font-size: 0.9rem;
    color: #555;
    line-height: 1.8;
    max-height: 300px;
    overflow-y: auto;
  }
  .hidden { display: none; }
  .score-big { font-size: 3rem; font-weight: bold; color: #00796b; margin: 10px 0; }
  .qr-box {
    background: #f1f8e9;
    border-radius: 12px;
    padding: 16px;
    margin-top: 12px;
    text-align: center;
  }
  .qr-box img { margin: 10px auto; display: block; border-radius: 8px; }
  .qr-box p { font-size: 0.75rem; color: #777; word-break: break-all; margin-top: 8px; }
  .stat { font-size: 1.05rem; font-weight: bold; color: #00796b; }
  .divider { border: none; border-top: 1px solid #eee; margin: 12px 0; }
</style>
</head>
<body>
<div class="card">
  <h1>🌿 Oddychaj, Ruszaj, Myśl</h1>
  <h3>Twoje Zdrowie to Kod Dnia!</h3>

  <!-- LOGIN -->
  <div id="login">
    <label>Twoje imię (opcjonalnie):</label>
    <input id="nickname" type="text" placeholder="np. Kasia, Kl. 2B...">
    <button class="btn btn-green" onclick="startGame()">▶ Rozpocznij grę</button>
    <hr class="divider" style="margin-top:24px;">
    <label>Hasło admina:</label>
    <input id="adminPass" type="password" placeholder="Hasło admina...">
    <button class="btn btn-yellow" onclick="showAdmin()">🔒 Panel nauczyciela</button>
  </div>

  <!-- GRA -->
  <div id="game" class="hidden">
    <div class="progress" id="progressText"></div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
    </div>
    <p id="question"></p>
    <div id="answers"></div>
    <p id="result"></p>
  </div>

  <!-- ADMIN -->
  <div id="admin" class="hidden">
    <div class="admin-box" id="adminData">Ładowanie...</div>
    <button class="btn btn-yellow" style="margin-top:12px;" onclick="clearResults()">🗑 Wyczyść wyniki</button>
    <button class="btn btn-gray"   style="margin-top:8px;"  onclick="toggleQR()">📱 Pokaż / ukryj QR kod</button>
    <div id="qrSection" class="hidden qr-box">
      <b>Zeskanuj by zagrać:</b>
      <div id="qrcode"></div>
      <p id="qrLink"></p>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy }
  from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBrY5eRtLvNH43tmcb_3s3APul-uQzH8ok",
  authDomain: "edu-zdrowotna.firebaseapp.com",
  projectId: "edu-zdrowotna",
  storageBucket: "edu-zdrowotna.firebasestorage.app",
  messagingSenderId: "434567782145",
  appId: "1:434567782145:web:0311d68279361687324500"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const ADMIN_PASSWORD = "admin";

window._db = db;

window.saveToFirebase = async (score, nick) => {
  await addDoc(collection(db, "wyniki"), {
    wynik: score,
    nick: nick || "Anonim",
    data: new Date().toLocaleString("pl-PL"),
    ts: Date.now()
  });
};

window.showAdmin = async () => {
  if (document.getElementById("adminPass").value !== ADMIN_PASSWORD) {
    alert("Błędne hasło admina!"); return;
  }
  document.getElementById("admin").classList.remove("hidden");
  document.getElementById("adminData").innerHTML = "⏳ Ładowanie...";
  try {
    const q = query(collection(db, "wyniki"), orderBy("ts", "desc"));
    const snap = await getDocs(q);
    const results = [];
    snap.forEach(d => results.push(d.data()));
    if (!results.length) {
      document.getElementById("adminData").innerHTML = "<i>Brak wyników</i>"; return;
    }
    const avg  = (results.reduce((a,b) => a + b.wynik, 0) / results.length).toFixed(2);
    const best = Math.max(...results.map(r => r.wynik));
    let html = `<span class="stat">👥 ${results.length} graczy &nbsp;|&nbsp; ⭐ Średnia: ${avg}/7 &nbsp;|&nbsp; 🏆 Max: ${best}/7</span><hr class="divider">`;
    results.forEach((r, i) => {
      html += `<b>#${i+1} ${r.nick}</b> – ${r.wynik}/7 <small style="color:#bbb">(${r.data})</small><br>`;
    });
    document.getElementById("adminData").innerHTML = html;
  } catch(e) {
    document.getElementById("adminData").innerHTML = "❌ Błąd połączenia z bazą.";
  }
};

window.clearResults = async () => {
  if (!confirm("Na pewno wyczyścić WSZYSTKIE wyniki?")) return;
  const snap = await getDocs(collection(db, "wyniki"));
  await Promise.all(snap.docs.map(d => deleteDoc(doc(db, "wyniki", d.id))));
  document.getElementById("adminData").innerHTML = "<i>Wyniki wyczyszczone ✅</i>";
};

window.toggleQR = () => {
  const sec = document.getElementById("qrSection");
  sec.classList.toggle("hidden");
  if (!sec.classList.contains("hidden") && !document.getElementById("qrcode").innerHTML) {
    const url = window.location.href;
    document.getElementById("qrLink").innerText = url;
    document.getElementById("qrcode").innerHTML =
      `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}" width="200" height="200" alt="QR">`;
  }
};
</script>

<script>
const allQuestions = [
  { q: "Ile godzin snu potrzebuje nastolatek?",   a: ["4-5", "7-9", "12"],                              correct: 1 },
  { q: "Który napój jest najzdrowszy?",            a: ["Sok gazowany", "Woda", "Energetyk"],              correct: 1 },
  { q: "Ile kroków dziennie jest zalecane?",       a: ["1000", "10 000", "500"],                          correct: 1 },
  { q: "Co pomaga redukować stres?",               a: ["Ruch", "Brak snu", "Fast food"],                  correct: 0 },
  { q: "Najlepsze śniadanie to:",                  a: ["Brak", "Zbilansowane", "Same słodycze"],          correct: 1 },
  { q: "Ile razy dziennie warto jeść?",            a: ["1", "4-5", "10"],                                 correct: 1 },
  { q: "Najlepsza forma aktywności to:",           a: ["Brak ruchu", "Regularna aktywność", "Tylko gry"], correct: 1 },
  { q: "Co szkodzi zdrowiu?",                      a: ["Sen", "Ruch", "Brak snu"],                        correct: 2 },
  { q: "Warzywa są:",                              a: ["Niezdrowe", "Zdrowe", "Obojętne"],                correct: 1 },
  { q: "Jak często powinno się ćwiczyć?",          a: ["Codziennie lub regularnie", "Nigdy", "Raz w roku"], correct: 0 },
  { q: "Co jest źródłem witamin?",                 a: ["Warzywa i owoce", "Fast food", "Słodycze"],      correct: 0 },
  { q: "Ile wody dziennie?",                       a: ["2 litry", "0,5 litra", "5 litrów"],               correct: 0 },
  { q: "Najlepszy odpoczynek to:",                 a: ["Sen", "Telefon", "Brak przerwy"],                 correct: 0 },
  { q: "Co poprawia kondycję?",                    a: ["Ruch", "Leżenie", "Brak snu"],                    correct: 0 },
  { q: "Zdrowa przekąska to:",                     a: ["Owoc", "Chipsy", "Batony"],                       correct: 0 },
  { q: "Co robić przed snem?",                     a: ["Relaks", "Telefon", "Energetyk"],                 correct: 0 },
  { q: "Najlepsza pora na ruch:",                  a: ["Dowolna", "Nigdy", "Raz w miesiącu"],             correct: 0 },
  { q: "Co wzmacnia zdrowie psychiczne?",          a: ["Rozmowa", "Izolacja", "Brak snu"],                correct: 0 },
  { q: "Czy śniadanie jest ważne?",                a: ["Tak", "Nie", "Nie wiem"],                         correct: 0 },
  { q: "Co daje energię?",                         a: ["Zdrowa dieta", "Fast food", "Brak jedzenia"],     correct: 0 }
];

let questions = [], current = 0, score = 0, playerNick = "";

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

window.startGame = () => {
  playerNick = document.getElementById("nickname").value.trim() || "Anonim";
  document.getElementById("login").style.display = "none";
  document.getElementById("game").classList.remove("hidden");
  questions = shuffle([...allQuestions]).slice(0, 7);
  current = 0; score = 0;
  showQuestion();
};

function showQuestion() {
  const q = questions[current];
  document.getElementById("progressText").innerText = `Pytanie ${current + 1} z ${questions.length}`;
  document.getElementById("progressBar").style.width = ((current / questions.length) * 100) + "%";
  document.getElementById("question").innerText = q.q;
  document.getElementById("result").innerText = "";
  const labels = ["A", "B", "C"];
  document.getElementById("answers").innerHTML = q.a.map((ans, i) =>
    `<button class="btn-answer" onclick="checkAnswer(${i})"><b>${labels[i]}.</b> ${ans}</button>`
  ).join("");
}

window.checkAnswer = (i) => {
  document.querySelectorAll(".btn-answer").forEach(b => b.disabled = true);
  const correct = questions[current].correct;
  const btns = document.querySelectorAll(".btn-answer");
  if (i === correct) {
    score++;
    btns[i].style.background = "#a5d6a7";
    document.getElementById("result").innerText = "✅ Dobrze!";
  } else {
    btns[i].style.background = "#ef9a9a";
    btns[correct].style.background = "#a5d6a7";
    document.getElementById("result").innerText = "❌ Błąd!";
  }
  setTimeout(() => { current++; current < questions.length ? showQuestion() : endGame(); }, 900);
};

async function endGame() {
  document.getElementById("progressText").innerText = "Koniec gry!";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("question").innerHTML =
    `🎉 Świetnie, ${playerNick}!<div class="score-big">${score}/7</div>`;
  document.getElementById("answers").innerHTML = `<p style="color:#aaa;font-size:0.85rem">💾 Zapisuję wynik...</p>`;
  document.getElementById("result").innerText = "";
  await window.saveToFirebase(score, playerNick);
  document.getElementById("answers").innerHTML =
    `<p style="color:#00796b;margin-bottom:10px;">✅ Wynik zapisany!</p>
     <button class="btn btn-green" onclick="location.reload()">🔄 Zagraj ponownie</button>`;
}
</script>
</body>
</html>
