<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oddychaj, Ruszaj, Myśl</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e0f7fa, #b2ebf2);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 28px 20px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    text-align: center;
  }
  h1 { font-size: 1.5rem; color: #00796b; margin-bottom: 4px; }
  h3 { font-size: 0.95rem; color: #555; margin-bottom: 24px; font-weight: normal; }
  label {
    display: block;
    text-align: left;
    font-size: 0.85rem;
    color: #444;
    margin-bottom: 4px;
    margin-top: 14px;
  }
  input[type="password"], input[type="text"] {
    width: 100%;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 1rem;
    outline: none;
    transition: border 0.2s;
  }
  input:focus { border-color: #00796b; }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:active { opacity: 0.8; }
  .btn-green  { background: #00796b; color: white; }
  .btn-yellow { background: #f9a825; color: white; }
  .btn-gray   { background: #eee; color: #333; }
  .btn-answer {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    font-size: 0.95rem;
    background: #e0f2f1;
    color: #004d40;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
    text-align: left;
  }
  .btn-answer:active { background: #b2dfdb; }
  #question {
    font-size: 1.1rem;
    font-weight: bold;
    color: #222;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .progress { font-size: 0.8rem; color: #aaa; margin-bottom: 10px; }
  .progress-bar-bg {
    background: #e0e0e0;
    border-radius: 10px;
    height: 8px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 8px;
    background: #00796b;
    border-radius: 10px;
    transition: width 0.4s;
  }
  #result { font-size: 1rem; color: #00796b; margin-top: 16px; font-weight: bold; }
  .admin-box {
    background: #fff8e1;
    border-radius: 12px;
    padding: 16px;
    margin-top: 16px;
    text-align: left;
    font-size: 0.9rem;
    color: #555;
    line-height: 1.8;
    max-height: 320px;
    overflow-y: auto;
  }
  .hidden { display: none; }
  .score-big { font-size: 2.6rem; font-weight: bold; color: #00796b; margin: 10px 0 4px; }
  .score-pct { font-size: 1.2rem; color: #888; margin-bottom: 6px; }
  .qr-box {
    background: #f1f8e9;
    border-radius: 12px;
    padding: 16px;
    margin-top: 12px;
    text-align: center;
  }
  .qr-box img { margin: 10px auto; display: block; border-radius: 8px; }
  .qr-box p { font-size: 0.75rem; color: #777; word-break: break-all; margin-top: 8px; }
  .stat { font-size: 1.05rem; font-weight: bold; color: #00796b; }
  .divider { border: none; border-top: 1px solid #eee; margin: 12px 0; }
</style>
</head>
<body>
<div class="card">
  <h1>🌿 Oddychaj, Ruszaj, Myśl</h1>
  <h3>Twoje Zdrowie to Kod Dnia!</h3>

  <!-- LOGIN -->
  <div id="login">
    <label>Twoje imię (opcjonalnie):</label>
    <input id="nickname" type="text" placeholder="np. Kasia, Kl. 2B...">
    <button class="btn btn-green" onclick="startGame()">▶ Rozpocznij grę</button>
    <hr class="divider" style="margin-top:24px;">
    <label>Hasło admina:</label>
    <input id="adminPass" type="password" placeholder="Hasło admina...">
    <button class="btn btn-yellow" onclick="showAdmin()">🔒 Panel nauczyciela</button>
  </div>

  <!-- GRA -->
  <div id="game" class="hidden">
    <div class="progress" id="progressText"></div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
    </div>
    <p id="question"></p>
    <div id="answers"></div>
    <p id="result"></p>
  </div>

  <!-- ADMIN -->
  <div id="admin" class="hidden">
    <div class="admin-box" id="adminData">Ładowanie...</div>
    <button class="btn btn-yellow" style="margin-top:12px;" onclick="clearResults()">🗑 Wyczyść wyniki</button>
    <button class="btn btn-gray"   style="margin-top:8px;"  onclick="toggleQR()">📱 Pokaż / ukryj QR kod</button>
    <div id="qrSection" class="hidden qr-box">
      <b>Zeskanuj by zagrać:</b>
      <div id="qrcode"></div>
      <p id="qrLink"></p>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy }
  from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBrY5eRtLvNH43tmcb_3s3APul-uQzH8ok",
  authDomain: "edu-zdrowotna.firebaseapp.com",
  projectId: "edu-zdrowotna",
  storageBucket: "edu-zdrowotna.firebasestorage.app",
  messagingSenderId: "434567782145",
  appId: "1:434567782145:web:0311d68279361687324500"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const ADMIN_PASSWORD = "edukacjazdrowotna";

window.saveToFirebase = async (score, total, nick) => {
  await addDoc(collection(db, "wyniki"), {
    wynik: score,
    total: total,
    pct: Math.round((score / total) * 100),
    nick: nick || "Anonim",
    data: new Date().toLocaleString("pl-PL"),
    ts: Date.now()
  });
};

window.showAdmin = async () => {
  if (document.getElementById("adminPass").value !== ADMIN_PASSWORD) {
    alert("Błędne hasło admina!"); return;
  }
  document.getElementById("admin").classList.remove("hidden");
  document.getElementById("adminData").innerHTML = "⏳ Ładowanie...";
  try {
    const q = query(collection(db, "wyniki"), orderBy("ts", "desc"));
    const snap = await getDocs(q);
    const results = [];
    snap.forEach(d => results.push(d.data()));
    if (!results.length) {
      document.getElementById("adminData").innerHTML = "<i>Brak wyników</i>"; return;
    }
    const avgPct = Math.round(results.reduce((a,b) => a + b.pct, 0) / results.length);
    const avgPts = (results.reduce((a,b) => a + b.wynik, 0) / results.length).toFixed(1);
    const bestPct = Math.max(...results.map(r => r.pct));
    let html = `<span class="stat">👥 ${results.length} graczy</span><hr class="divider">
<span class="stat">⭐ Średnia: ${avgPts} pkt / ${avgPct}%</span><br>
<span class="stat">🏆 Najlepszy: ${bestPct}%</span><hr class="divider">`;
    results.forEach((r, i) => {
      html += `<b>#${i+1} ${r.nick}</b> – ${r.wynik}/${r.total} <span style="color:#00796b;font-weight:bold">(${r.pct}%)</span> <small style="color:#bbb">${r.data}</small><br>`;
    });
    document.getElementById("adminData").innerHTML = html;
  } catch(e) {
    document.getElementById("adminData").innerHTML = "❌ Błąd połączenia z bazą.";
  }
};

window.clearResults = async () => {
  if (!confirm("Na pewno wyczyścić WSZYSTKIE wyniki?")) return;
  const snap = await getDocs(collection(db, "wyniki"));
  await Promise.all(snap.docs.map(d => deleteDoc(doc(db, "wyniki", d.id))));
  document.getElementById("adminData").innerHTML = "<i>Wyniki wyczyszczone ✅</i>";
};

window.toggleQR = () => {
  const sec = document.getElementById("qrSection");
  sec.classList.toggle("hidden");
  if (!sec.classList.contains("hidden") && !document.getElementById("qrcode").innerHTML) {
    const url = window.location.href;
    document.getElementById("qrLink").innerText = url;
    document.getElementById("qrcode").innerHTML =
      `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}" width="200" height="200" alt="QR">`;
  }
};
</script>

<script>
const allQuestions = [
  { q: "Co to jest zdrowie?", a: ["Brak choroby", "Dobra kondycja fizyczna", "Stan pełnego dobrostanu fizycznego, psychicznego i społecznego"], correct: 2 },
  { q: "Co wpływa na zdrowie najbardziej?", a: ["Styl życia", "Pogoda", "Szkoła"], correct: 0 },
  { q: "Ile godzin snu potrzebuje nastolatek?", a: ["4–5", "12", "7–9"], correct: 2 },
  { q: "Co to jest profilaktyka?", a: ["Ignorowanie objawów", "Zapobieganie chorobom", "Leczenie chorób"], correct: 1 },
  { q: "Który czynnik NIE wpływa na zdrowie?", a: ["Kolor oczu", "Dieta", "Aktywność fizyczna"], correct: 0 },
  { q: "Ile posiłków dziennie zaleca się jeść?", a: ["10", "1", "3–5"], correct: 2 },

  { q: "Co zawiera najwięcej witamin?", a: ["Warzywa i owoce", "Fast food", "Słodycze"], correct: 0 },
  { q: "Co należy ograniczać w diecie?", a: ["Warzywa", "Wodę", "Cukier"], correct: 2 },
  { q: "Ile wody dziennie należy pić?", a: ["5 l", "ok. 1,5–2 l", "0,5 l"], correct: 1 },
  { q: "Ile ruchu dziennie zaleca się?", a: ["3 godziny", "10 min", "60 min"], correct: 2 },
  { q: "Co daje aktywność fizyczna?", a: ["Nic", "Poprawia kondycję", "Pogarsza zdrowie"], correct: 1 },
  { q: "Który sport poprawia kondycję?", a: ["Leżenie", "Spanie", "Bieganie"], correct: 2 },
  { q: "Co się dzieje bez ruchu?", a: ["Więcej energii", "Ryzyko chorób", "Lepsze zdrowie"], correct: 1 },
  { q: "Rozgrzewka jest:", a: ["Szkodliwa", "Ważna", "Niepotrzebna"], correct: 1 },
  { q: "Stres to:", a: ["Choroba", "Zawsze coś złego", "Naturalna reakcja organizmu"], correct: 2 },
  { q: "Jak radzić sobie ze stresem?", a: ["Rozmawiać i odpoczywać", "Ignorować", "Nic nie robić"], correct: 0 },
  { q: "Sen wpływa na:", a: ["Tylko wzrost", "Nic", "Zdrowie psychiczne i fizyczne"], correct: 2 },
  { q: "Depresja to:", a: ["Lenistwo", "Choroba", "Humor"], correct: 1 },
  { q: "Pomoc psychologiczna jest:", a: ["Zbędna", "Wstydliwa", "Normalna i ważna"], correct: 2 },
  { q: "Nikotyna:", a: ["Dodaje energii", "Uzależnia", "Jest zdrowa"], correct: 1 },
  { q: "Alkohol:", a: ["Poprawia koncentrację", "Nie szkodzi", "Szkodzi zdrowiu"], correct: 2 },
  { q: "Uzależnienie to:", a: ["Choroba i przymus", "Zwyczaj", "Hobby"], correct: 0 },
  { q: "Narkotyki:", a: ["Pomagają w nauce", "Są bezpieczne", "Są niebezpieczne"], correct: 2 },
  { q: "E-papierosy:", a: ["Nie uzależniają", "Są zdrowe", "Też szkodzą"], correct: 2 },
  { q: "Jak często myć ręce?", a: ["Nigdy", "Rzadko", "Często"], correct: 2 },
  { q: "Ile razy dziennie myć zęby?", a: ["2 razy dziennie", "1 raz dziennie", "Nie trzeba"], correct: 0 },
  { q: "Higiena zapobiega:", a: ["Wzrostowi", "Chorobom", "Nauce"], correct: 1 },
  { q: "Brudne ręce mogą:", a: ["Przenosić bakterie", "Nic", "Leczyć"], correct: 0 },
  { q: "Prysznic jest:", a: ["Szkodliwy", "Ważny dla zdrowia", "Niepotrzebny"], correct: 1 },
  { q: "Pas bezpieczeństwa:", a: ["Przeszkadza", "Niepotrzebny", "Chroni życie"], correct: 2 },
  { q: "Kask na rowerze:", a: ["Wstyd", "Niepotrzebny", "Chroni głowę"], correct: 2 },
  { q: "Numer alarmowy w UE:", a: ["999", "911", "112"], correct: 2 },
  { q: "Pierwsza pomoc jest:", a: ["Zakazana", "Bardzo ważna", "Niepotrzebna"], correct: 1 },
  { q: "Oparzenia należy:", a: ["Smarować czymkolwiek", "Ignorować", "Schłodzić wodą"], correct: 2 },
  { q: "Siedzący tryb życia jest:", a: ["Zdrowy", "Neutralny", "Szkodliwy"], correct: 2 },
  { q: "Ekrany przed snem:", a: ["Bez wpływu", "Pogarszają sen", "Pomagają spać"], correct: 1 },
  { q: "Regularność dnia:", a: ["Szkodzi", "Bez znaczenia", "Pomaga zdrowiu"], correct: 2 },
  { q: "Relacje z ludźmi są:", a: ["Ważne dla zdrowia", "Szkodliwe", "Nieważne"], correct: 0 },
  { q: "Odpoczynek jest:", a: ["Zbędny", "Stratą czasu", "Potrzebny"], correct: 2 },
  { q: "Szczepienia:", a: ["Są zbędne", "Chronią zdrowie", "Szkodzą"], correct: 1 },
  { q: "Badania kontrolne:", a: ["Wykrywają choroby", "Niepotrzebne", "Szkodzą"], correct: 0 },
  { q: "Nadwaga może:", a: ["Pomagać", "Szkodzić zdrowiu", "Nic"], correct: 1 },
  { q: "Słońce bez ochrony jest:", a: ["Leczy wszystko", "Bezpieczne", "Szkodliwe"], correct: 2 },
  { q: "SPF to:", a: ["Lek", "Rodzaj jedzenia", "Ochrona przed słońcem"], correct: 2 },
  { q: "Witaminy są:", a: ["Szkodliwe", "Potrzebne", "Nieważne"], correct: 1 },
  { q: "Sen poniżej 5h jest:", a: ["Zalecany", "Zdrowy", "Szkodliwy"], correct: 2 },
  { q: "Picie napojów energetycznych:", a: ["Bez wpływu", "Niezdrowe w nadmiarze", "Zdrowe"], correct: 1 },
  { q: "Zdrowie psychiczne i fizyczne:", a: ["Nie istnieją", "Nie są powiązane", "Są powiązane"], correct: 2 },
  { q: "Najlepszy sposób dbania o zdrowie:", a: ["Same leki", "Zdrowy styl życia", "Brak ruchu"], correct: 1 }
];

const TOTAL_QUESTIONS = 10;
let questions = [], current = 0, score = 0, playerNick = "";

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

window.startGame = () => {
  playerNick = document.getElementById("nickname").value.trim() || "Anonim";
  document.getElementById("login").style.display = "none";
  document.getElementById("game").classList.remove("hidden");
  questions = shuffle([...allQuestions]).slice(0, TOTAL_QUESTIONS);
  current = 0; score = 0;
  showQuestion();
};

function showQuestion() {
  const q = questions[current];
  document.getElementById("progressText").innerText = `Pytanie ${current + 1} z ${TOTAL_QUESTIONS}`;
  document.getElementById("progressBar").style.width = ((current / TOTAL_QUESTIONS) * 100) + "%";
  document.getElementById("question").innerText = q.q;
  document.getElementById("result").innerText = "";
  const labels = ["A", "B", "C"];
  document.getElementById("answers").innerHTML = q.a.map((ans, i) =>
    `<button class="btn-answer" onclick="checkAnswer(${i})"><b>${labels[i]}.</b> ${ans}</button>`
  ).join("");
}

window.checkAnswer = (i) => {
  document.querySelectorAll(".btn-answer").forEach(b => b.disabled = true);
  const correct = questions[current].correct;
  const btns = document.querySelectorAll(".btn-answer");
  if (i === correct) {
    score++;
    btns[i].style.background = "#a5d6a7";
    document.getElementById("result").innerText = "✅ Dobrze!";
  } else {
    btns[i].style.background = "#ef9a9a";
    btns[correct].style.background = "#a5d6a7";
    document.getElementById("result").innerText = "❌ Błąd!";
  }
  setTimeout(() => { current++; current < questions.length ? showQuestion() : endGame(); }, 900);
};

async function endGame() {
  const pct = Math.round((score / TOTAL_QUESTIONS) * 100);
  document.getElementById("progressText").innerText = "Koniec gry!";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("question").innerHTML =
    `🎉 Świetnie, ${playerNick}!
     <div class="score-big">${score}/${TOTAL_QUESTIONS}</div>
     <div class="score-pct">${pct}% poprawnych odpowiedzi</div>`;
  document.getElementById("answers").innerHTML = `<p style="color:#aaa;font-size:0.85rem">💾 Zapisuję wynik...</p>`;
  document.getElementById("result").innerText = "";
  await window.saveToFirebase(score, TOTAL_QUESTIONS, playerNick);
  document.getElementById("answers").innerHTML =
    `<p style="color:#00796b;margin-bottom:10px;">✅ Wynik zapisany!</p>
     <button class="btn btn-green" onclick="location.reload()">🔄 Zagraj ponownie</button>`;
}
</script>
</body>
</html>
